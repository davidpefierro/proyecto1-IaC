---
- name: Instalar Apache, PHP y lo que necesita la aplicación
  ansible.builtin.apt:
    name: "{{ paquetes_web }}"
    state: present
    lock_timeout: 600

- name: Activar mod_rewrite (lo usa el .htaccess de la aplicación)
  community.general.apache2_module:
    name: rewrite
    state: present
  notify: Reiniciar apache

- name: Apache arrancado y habilitado
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

- name: Crear el virtual host
  ansible.builtin.template:
    src: guestbook.conf.j2
    dest: /etc/apache2/sites-available/guestbook.conf
    owner: root
    group: root
    mode: "0644"
  notify: Recargar apache

- name: Habilitar el virtual host
  ansible.builtin.command: a2ensite guestbook
  args:
    creates: /etc/apache2/sites-enabled/guestbook.conf
  notify: Recargar apache

- name: Deshabilitar el sitio por defecto
  ansible.builtin.command: a2dissite 000-default
  args:
    removes: /etc/apache2/sites-enabled/000-default.conf
  notify: Recargar apache

# update: false para que la segunda vez no choque con el config.php que
# sobrescribimos (está versionado en el repo de la aplicación)
- name: Desplegar la aplicación
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ document_root }}"
    version: "{{ app_version }}"
    update: false

- name: Generar config.php
  ansible.builtin.template:
    src: config.php.j2
    dest: "{{ document_root }}/config.php"
    owner: root
    group: www-data
    mode: "0640"
