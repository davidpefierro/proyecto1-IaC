---
- name: Instalar Apache
  ansible.builtin.apt:
    name: "{{ paquetes_web }}"
    state: present
    lock_timeout: 600

# PHP ya no se ejecuta en esta máquina, se encarga php por PHP-FPM
- name: Quitar mod_php si estuviera instalado
  ansible.builtin.apt:
    name: libapache2-mod-php*
    state: absent
    lock_timeout: 600
  notify: Reiniciar apache

- name: Activar mod_proxy_fcgi para mandar los .php a PHP-FPM
  community.general.apache2_module:
    name: proxy_fcgi
    state: present
  notify: Reiniciar apache

- name: Activar mod_rewrite (lo usa el .htaccess de la aplicación)
  community.general.apache2_module:
    name: rewrite
    state: present
  notify: Reiniciar apache

- name: Apache arrancado y habilitado
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

- name: Crear el virtual host
  ansible.builtin.template:
    src: guestbook.conf.j2
    dest: /etc/apache2/sites-available/guestbook.conf
    owner: root
    group: root
    mode: "0644"
  notify: Recargar apache

- name: Habilitar el virtual host
  ansible.builtin.command: a2ensite guestbook
  args:
    creates: /etc/apache2/sites-enabled/guestbook.conf
  notify: Recargar apache

- name: Deshabilitar el sitio por defecto
  ansible.builtin.command: a2dissite 000-default
  args:
    removes: /etc/apache2/sites-enabled/000-default.conf
  notify: Recargar apache

# Apache necesita los ficheros para servir los estáticos (css) y para las
# reglas del .htaccess, que comprueban si el fichero existe. El config.php
# con la contraseña solo está en php, que es quien se conecta a la base de datos
- name: Desplegar la aplicación
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ document_root }}"
    version: "{{ app_version }}"
    update: false
