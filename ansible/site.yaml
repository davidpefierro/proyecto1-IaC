---
- name: Configuración común
  hosts: all
  become: true
  # Los facts se recogen en el rol, cuando la máquina ya responde por ssh
  gather_facts: false
  roles:
    - commons

- name: Servidor de base de datos
  hosts: servidores_bd
  become: true
  roles:
    - bd

- name: Servidor web
  hosts: servidores_web
  become: true
  roles:
    - web
