---
- name: Configuración común
  hosts: all
  become: true
  # Los facts se recogen en el rol, cuando la máquina ya responde por ssh
  gather_facts: false
  roles:
    - commons

- name: Servidor de base de datos
  hosts: servidores_bd
  become: true
  roles:
    - bd

# Antes que php y web, que montan lo que exporta
- name: Servidor NAS
  hosts: servidores_nas
  become: true
  roles:
    - nas

- name: Servidor PHP-FPM
  hosts: servidores_php
  become: true
  roles:
    - cliente_nfs
    - php

- name: Servidor web
  hosts: servidores_web
  become: true
  roles:
    - cliente_nfs
    - web
