---
- name: Instalar MariaDB
  ansible.builtin.apt:
    name: mariadb-server
    state: present
    lock_timeout: 600

- name: Escuchar solo en la red de datos
  ansible.builtin.template:
    src: 60-guestbook.cnf.j2
    dest: "{{ mariadb_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar mariadb

- name: MariaDB arrancado y habilitado
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

# Aplicar ya el bind-address antes de crear nada
- name: Aplicar la configuración
  ansible.builtin.meta: flush_handlers

- name: Crear la base de datos
  community.mysql.mysql_db:
    name: "{{ bd_nombre }}"
    state: present
    login_unix_socket: "{{ mariadb_socket }}"

- name: Crear el usuario (solo desde el servidor web por la red de datos)
  community.mysql.mysql_user:
    name: "{{ bd_usuario }}"
    host: "{{ ip_datos_web }}"
    password: "{{ bd_password }}"
    priv: "{{ bd_nombre }}.*:ALL"
    state: present
    login_unix_socket: "{{ mariadb_socket }}"
