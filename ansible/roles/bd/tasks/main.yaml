---
- name: Instalar MariaDB
  ansible.builtin.apt:
    name: mariadb-server
    state: present
    lock_timeout: 600

- name: Escuchar solo en la red de datos
  ansible.builtin.template:
    src: 60-guestbook.cnf.j2
    dest: "{{ mariadb_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar mariadb

- name: MariaDB arrancado y habilitado
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

# Aplicar ya el bind-address antes de crear nada
- name: Aplicar la configuración
  ansible.builtin.meta: flush_handlers

- name: Crear la base de datos
  community.mysql.mysql_db:
    name: "{{ bd_nombre }}"
    state: present
    login_unix_socket: "{{ mariadb_socket }}"

- name: Crear el usuario (solo desde el servidor php por la red de datos)
  community.mysql.mysql_user:
    name: "{{ bd_usuario }}"
    host: "{{ ip_datos_php }}"
    password: "{{ bd_password }}"
    priv: "{{ bd_nombre }}.*:ALL"
    column_case_sensitive: true
    state: present
    login_unix_socket: "{{ mariadb_socket }}"

# schema.sql no es idempotente (CREATE TABLE sin IF NOT EXISTS), así que
# solo se importa si la tabla messages todavía no existe
- name: Comprobar si ya están las tablas
  community.mysql.mysql_query:
    login_db: "{{ bd_nombre }}"
    query: SHOW TABLES LIKE 'messages'
    login_unix_socket: "{{ mariadb_socket }}"
  register: tablas
  changed_when: false

- name: Descargar schema.sql de la aplicación
  ansible.builtin.get_url:
    url: "{{ schema_url }}"
    dest: "{{ schema_destino }}"
    mode: "0644"
  when: tablas.rowcount[0] == 0

- name: Crear las tablas
  community.mysql.mysql_db:
    name: "{{ bd_nombre }}"
    state: import
    target: "{{ schema_destino }}"
    login_unix_socket: "{{ mariadb_socket }}"
  when: tablas.rowcount[0] == 0
