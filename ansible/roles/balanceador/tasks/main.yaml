---
- name: Instalar HAProxy
  ansible.builtin.apt:
    name: haproxy
    state: present
    lock_timeout: 600

# Se comprueba la sintaxis antes de dejarla puesta
- name: Configuración de HAProxy
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: haproxy -c -f %s
  notify: Recargar haproxy

- name: HAProxy arrancado y habilitado
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true
